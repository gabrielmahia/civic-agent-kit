name: JICHO smoke tests

on:
  push:
    branches: [jicho-v0]
    paths:
      - 'src/civic_agent_kit/jicho/**'
      - 'tests/test_jicho.py'
      - 'scripts/jicho_mock_backtest.py'
      - '.github/workflows/jicho-smoke.yml'
  pull_request:
    paths:
      - 'src/civic_agent_kit/jicho/**'
      - 'tests/test_jicho.py'
      - 'scripts/jicho_mock_backtest.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_jicho.py
      - run: python scripts/jicho_mock_backtest.py
