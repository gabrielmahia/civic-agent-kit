[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-agent-kit"
version = "0.2.1"
description = "Python SDK for building civic AI tools across Africa — M-Pesa, parliament, budgets, drought, MCP and A2A"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gabriel Mahia", email = "contact@aikungfu.dev"}]
keywords = [
    "kenya", "africa", "civic-tech", "mcp", "a2a", "parliament",
    "budget", "east-africa", "ai", "agent", "llm", "drought", "sacco",
    "model-context-protocol", "constitution"
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
full = ["pandas>=2.0.0", "crewai>=0.70.0"]
dev  = ["pytest>=8.0", "ruff>=0.3.0"]

[project.scripts]
civic-agent-kit = "civic_agent_kit.server:mcp.run"

[project.urls]
Homepage   = "https://github.com/gabrielmahia/civic-agent-kit"
Repository = "https://github.com/gabrielmahia/civic-agent-kit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "0.2.1"
