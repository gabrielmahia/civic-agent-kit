[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-agent-kit"
version = "0.2.2"
description = "Python SDK for building civic AI tools across Africa — M-Pesa, parliament, budgets, drought, MCP and A2A"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gabriel Mahia", email = "contact@aikungfu.dev"}]
keywords = [
    "kenya", "africa", "civic-tech", "mcp", "a2a", "parliament",
    "budget", "east-africa", "ai", "agent", "llm", "drought", "sacco",
    "model-context-protocol", "constitution"
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
full = ["pandas>=2.0.0", "crewai>=0.70.0"]
dev  = ["pytest>=8.0", "ruff>=0.3.0"]

[project.scripts]
civic-agent-kit = "civic_agent_kit.server:mcp.run"

[project.urls]
Homepage   = "https://github.com/gabrielmahia/civic-agent-kit"
Repository = "https://github.com/gabrielmahia/civic-agent-kit"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
# build: 1782218508

[tool.ruff.lint]
# Pinned ruff in CI; these are documented, intentional patterns rather than debt:
#   BLE001/TRY004 — handlers catch broadly ON PURPOSE so one bad input cannot
#                   sink an entire run.
#   S112          — `continue` on exception is the intended degrade-gracefully path.
#   PLW1510       — test subprocess calls assert on returncode explicitly.
#   C408/SIM103/SIM118/RUF059/EXE001/DTZ003 — style-only; not worth churning working code.
ignore = ["BLE001", "TRY004", "S112", "PLW1510", "C408", "SIM103", "SIM118",
          "RUF059", "EXE001", "DTZ003", "DTZ005", "C401", "RUF012",
          # RUF013 (implicit Optional) is real typing debt — tracked for a proper
          # signature pass rather than a rushed edit to a published server API.
          "RUF013", "E501"]
